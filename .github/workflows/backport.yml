name: Backport PR

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    # Solo cuando una rama release/* o hotfix/* se mergea a master
    if: >
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backport a develop
        uses: korthout/backport-action@v3
        with:
          target_branches: develop
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Nombre compatible con branch-policy (chore/<kebab-case>)
          branch_name: chore/backport-${pull_number}-to-${target_branch}
          # El cambio ya figura en las notas de versión del PR original
          add_labels: sin-changelog
          pull_title: "[backport develop] ${pull_title}"
          pull_description: |
            Backport automático del PR #${pull_number} hacia `develop`.

            **PR original:** #${pull_number} — ${pull_title}
