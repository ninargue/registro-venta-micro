version: 2

updates:
  # GitHub Actions usadas por los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # Backend: dependencias Python gestionadas con uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv:
        update-types:
          - "minor"
          - "patch"

  # Frontend: dependencias npm (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-frontend:
        update-types:
          - "minor"
          - "patch"

  # Herramientas de la raíz: husky y lint-staged (package.json en /)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-root:
        update-types:
          - "minor"
          - "patch"
