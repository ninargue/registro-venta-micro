# Categorías de las notas de versión generadas automáticamente
# (gh release create vX.Y.Z --generate-notes, o el botón "Generate release notes").
# Cada PR aparece solo en la primera categoría cuyas etiquetas coinciden.

changelog:
  exclude:
    labels:
      - sin-changelog
      - tipo:release
  categories:
    - title: ⚠️ Cambios incompatibles
      labels: [breaking-change]
    - title: 🔒 Seguridad
      labels: [seguridad]
    - title: 🗄️ Migraciones de base de datos
      labels: [migracion]
    - title: ✨ Nuevas funcionalidades
      labels: [tipo:feature]
    - title: 🐛 Correcciones
      labels: [tipo:fix, tipo:hotfix]
    - title: ♻️ Refactor
      labels: [tipo:refactor]
    - title: 📝 Documentación
      labels: [tipo:docs]
    - title: 🧰 Mantenimiento y pruebas
      labels: [tipo:chore, tipo:test]
    - title: Otros cambios
      labels: ["*"]
